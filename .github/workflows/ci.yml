name: CI Retraining

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retraining-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrain:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: file:${{ github.workspace }}/MLProject/mlruns
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: MLProject/requirements.txt

      - name: Check Env
        run: python --version

      - name: Install dependencies
        run: python -m pip install -r MLProject/requirements.txt

      - name: Run mlflow project
        working-directory: MLProject
        run: mlflow run . --env-manager=local

      - name: Get latest MLflow run_id
        id: latest_run
        working-directory: MLProject
        run: |
          RUN_ID="$(python -c 'import mlflow; runs = mlflow.search_runs(experiment_ids=["0"], order_by=["start_time DESC"], max_results=1); print(runs.iloc[0]["run_id"])')"
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Latest MLflow run_id: $RUN_ID"

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mlflow-artifacts-${{ steps.latest_run.outputs.run_id }}
          path: MLProject/mlruns/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build Docker model image with MLflow
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        working-directory: MLProject
        run: |
          IMAGE_NAME="${DOCKERHUB_USERNAME}/telco-churn-mlflow"
          mlflow models build-docker \
            --model-uri "runs:/${{ steps.latest_run.outputs.run_id }}/model" \
            --name "${IMAGE_NAME}:${{ github.sha }}" \
            --env-manager local
          docker tag "${IMAGE_NAME}:${{ github.sha }}" "${IMAGE_NAME}:latest"

      - name: Push Docker model image
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          IMAGE_NAME="${DOCKERHUB_USERNAME}/telco-churn-mlflow"
          docker push "${IMAGE_NAME}:${{ github.sha }}"
          docker push "${IMAGE_NAME}:latest"

      - name: Publish workflow summary
        if: always()
        run: |
          {
            echo "## Telco Churn CI"
            echo "- MLflow run: \`${{ steps.latest_run.outputs.run_id }}\`"
            echo "- MLflow artifacts: uploaded to this workflow run"
            if [[ -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_TOKEN}" ]]; then
              echo "- Docker image: \`${DOCKERHUB_USERNAME}/telco-churn-mlflow:latest\`"
            else
              echo "- Docker image: skipped because Docker Hub secrets are not configured"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
